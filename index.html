<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CHAPTER 1 · 崗頂前地</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Kaiti SC","STKaiti",-apple-system,"PingFang TC",serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;overflow:hidden}

/* === 背景：崗頂黃昏 === */
#bg{position:absolute;inset:0;background:url('bg_gangding.jpg') center/cover no-repeat;opacity:0;transform:scale(1.06);transition:opacity 1.6s ease,transform 4.5s ease}
#bg.show{opacity:1;transform:scale(1)}
#bg::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.25) 0%,transparent 30%,transparent 55%,rgba(0,0,0,.72) 100%)}

/* === 劇院背景層（畫面4 淡入 + 推近 zoom） === */
#bg2{position:absolute;inset:0;background:url('bg_theatre_out.jpg') center/cover no-repeat;opacity:0;transform:scale(1.18);z-index:1}
#bg2::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.28) 0%,transparent 32%,transparent 52%,rgba(0,0,0,.7) 100%)}
#bg2.show{opacity:1;animation:kbZoom 2.4s ease forwards}
@keyframes kbZoom{0%{transform:scale(1.18)}100%{transform:scale(1.04)}}

/* === 門楣背景層（最後一句推近捲軸） === */
#bg3{position:absolute;inset:0;background:url('bg_theatre.jpg') center/cover no-repeat;opacity:0;transform:scale(1.2);z-index:2}
#bg3::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3) 0%,transparent 30%,transparent 55%,rgba(0,0,0,.7) 100%)}
#bg3.show{opacity:1;animation:kbZoom3 2.2s ease forwards}
@keyframes kbZoom3{0%{transform:scale(1.2)}100%{transform:scale(1.02)}}

/* === 內廳背景層（推門入內） === */
#bg4{position:absolute;inset:0;background:url('bg_inside.jpg') center/cover no-repeat;opacity:0;transform:scale(1.06);z-index:2}
#bg4::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.32) 0%,transparent 30%,transparent 52%,rgba(0,0,0,.72) 100%)}
#bg4.show{opacity:1;animation:kbZoom4 2s ease forwards}
@keyframes kbZoom4{0%{transform:scale(1.06)}100%{transform:scale(1)}}

/* === 反向視角背景層（轉身數舞台） === */
#bg5{position:absolute;inset:0;background:url('bg_back.jpg') center/cover no-repeat;opacity:0;transform:scale(1.05);z-index:2}
#bg5::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.3) 0%,transparent 32%,transparent 55%,rgba(0,0,0,.7) 100%)}
#bg5.show{opacity:1;animation:kbZoom5 2s ease forwards}
@keyframes kbZoom5{0%{transform:scale(1.05)}100%{transform:scale(1)}}

/* === 指點劇院：金光特效層 === */
#fx{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0}
#fx.show{opacity:1;transition:opacity .5s ease}
#spotLabel{position:absolute;top:10%;left:44%;transform:translateX(-50%) translateY(8px);padding:5px 18px;border:1px solid rgba(232,201,126,.8);border-radius:999px;background:rgba(20,16,12,.72);color:#f0d18a;font-size:14px;letter-spacing:3px;opacity:0;box-shadow:0 0 14px rgba(255,200,100,.35);white-space:nowrap;animation:labelIn .8s ease .8s forwards}
@keyframes labelIn{0%{opacity:0;transform:translateX(-50%) translateY(10px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}

/* === 開場黑屏＋金點流光 === */
#introBlack{position:absolute;inset:0;background:#000;z-index:30;transition:opacity .8s ease}
#introBlack.fade{opacity:0;pointer-events:none}
#goldDot{position:absolute;left:50%;top:62%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#ffd87a;box-shadow:0 0 14px 4px rgba(255,216,122,.8);animation:dotPulse 1.6s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
#trail{position:absolute;left:50%;top:62%;width:2px;height:0;background:linear-gradient(to top,rgba(255,216,122,.95),rgba(255,216,122,0));transform-origin:bottom center;opacity:0}
#trail.on{opacity:1;animation:trailUp 1.1s ease-out forwards}
@keyframes trailUp{0%{height:0;transform:translateX(0) rotate(-18deg)}100%{height:70vh;transform:translateX(-6vw) rotate(-18deg)}}

/* === 白金光過曝 === */
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff7e0 0%,#ffe9b0 45%,#fff 100%);z-index:40;opacity:0;pointer-events:none}
#flash.go{animation:flashGo .9s ease forwards}
@keyframes flashGo{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

/* === 頂部場景標籤 === */
#locLabel{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;transform:translateX(-50%) translateY(-12px);z-index:15;text-align:center;opacity:0;transition:opacity 1.2s ease .4s,transform 1.2s ease .4s}
#locLabel.show{opacity:1;transform:translateX(-50%) translateY(0)}
#locLabel .t1{display:inline-block;padding:6px 22px;border:1px solid rgba(212,168,87,.55);border-radius:999px;background:rgba(20,16,12,.55);color:#e8c97e;font-size:17px;letter-spacing:4px}

/* === Lúcia 立繪（蹲姿 / 站姿切換） === */
#luvia{position:absolute;left:-4px;bottom:calc(env(safe-area-inset-bottom,0px) + 122px);width:220px;height:auto;z-index:12;opacity:0;transform:translateY(60px);transition:opacity .7s ease,transform .8s cubic-bezier(.22,.61,.36,1),left .8s cubic-bezier(.22,.61,.36,1),width .8s ease;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
#luvia.show{opacity:1;transform:translateY(0)}
#luvia.stand{width:196px;left:8px}
#luvia.switching{transition:opacity .2s ease}
#luvia.close{left:50%;transform:translateX(-50%) scale(1.1)}
#luvia.spin{animation:spinSkirt .9s ease forwards}
@keyframes spinSkirt{0%{transform:translateX(-50%) scale(1.1) rotate(0deg)}100%{transform:translateX(-50%) scale(1.1) rotate(360deg)}}

/* === 背景壓暗遮罩（神秘靠近時） === */
#dim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:10;opacity:0;pointer-events:none;transition:opacity .5s ease}
#dim.show{opacity:1}

/* === 頭頂名字標籤 === */
#nameTag{position:absolute;left:57px;bottom:calc(env(safe-area-inset-bottom,0px) + 402px);z-index:13;opacity:0;transform:translateY(8px);transition:opacity .6s ease .15s,transform .6s ease .15s}
#nameTag.show{opacity:1;transform:translateY(0)}
#nameTag span{display:inline-block;padding:4px 16px;border:1px solid rgba(212,168,87,.7);border-radius:999px;background:rgba(28,24,20,.82);color:#e8c97e;font-size:14px;letter-spacing:4px}

/* === 對話框 === */
#dlgBox{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:14px;right:14px;min-height:104px;background:rgba(28,24,20,.92);border:1px solid rgba(180,150,100,.35);border-radius:12px;padding:16px 18px 20px;z-index:20;opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
#dlgBox.show{opacity:1;transform:translateY(0)}
#dlgName{color:#a89880;font-size:13px;letter-spacing:3px;margin-bottom:8px}
#dlgName.lucia{color:#d4a857}
#dlgText{color:#e8dcc8;font-size:16px;line-height:1.8;min-height:56px}
#dlgHint{position:absolute;right:16px;bottom:8px;color:#d4a857;font-size:15px;display:none;animation:hintBlink 1.2s ease-in-out infinite}
@keyframes hintBlink{0%,100%{opacity:.3}50%{opacity:1}}

/* === 謎題卡（門楣 Dom 題） === */
#puzzleCard{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.94);width:88%;max-width:346px;max-height:76vh;overflow-y:auto;background:linear-gradient(160deg,#efe3c2,#e2d0a4);border:1px solid #b98f3e;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.65),inset 0 0 60px rgba(150,110,50,.18);z-index:25;padding:22px 20px 18px;opacity:0;pointer-events:none;transition:opacity .6s ease,transform .6s ease}
#puzzleCard.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.pz-tag{display:inline-block;font-size:10px;letter-spacing:3px;color:#8a6a2a;border:1px solid #b98f3e;border-radius:3px;padding:2px 8px;margin-bottom:12px}
.pz-line{text-align:center;color:#4a3410;font-size:20px;letter-spacing:2px;line-height:1.7;margin-bottom:14px}
.pz-line .blank{display:inline-block;min-width:90px;border-bottom:2px solid #8a6a2a;color:#8a6a2a;text-align:center}
.pz-input{width:100%;padding:10px 12px;background:rgba(255,250,235,.7);border:1px solid #b98f3e;border-radius:4px;font-size:16px;text-align:center;color:#4a3410;outline:none;font-family:inherit;letter-spacing:2px;margin-bottom:10px}
.pz-btn{display:block;margin:12px auto 0;padding:9px 34px;background:#8a5a20;color:#f5e6c8;border:none;border-radius:999px;font-size:15px;letter-spacing:4px;cursor:pointer;font-family:inherit}
.pz-tip{text-align:center;color:#8a6a40;font-size:12px;margin-top:10px}
.pz-err{color:#a03a2a;font-size:12px;min-height:16px;margin-top:6px;text-align:center}
.pz-q{color:#4a3410;font-size:16px;line-height:1.8;margin-bottom:12px}
.pz-hintbtn{display:inline-block;padding:5px 14px;margin-bottom:10px;background:transparent;border:1px dashed #b98f3e;border-radius:999px;color:#8a6a2a;font-size:12.5px;cursor:pointer;font-family:inherit;letter-spacing:1px}
.pz-hint{color:#7a5a2a;font-size:12.5px;line-height:1.75;padding:10px 12px;background:rgba(255,248,225,.5);border-left:3px solid #b98f3e;border-radius:0 4px 4px 0;margin-bottom:14px}
.opt{display:block;width:100%;padding:11px 14px;margin-bottom:8px;background:rgba(255,250,235,.65);border:1px solid #b98f3e;border-radius:6px;color:#4a3410;font-size:14.5px;text-align:left;cursor:pointer;font-family:inherit}
.opt:active{background:#d9c694}
.opt.wrong{animation:shake .4s ease;border-color:#a03a2a}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.num-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.num-grid .opt{text-align:center;font-size:22px;padding:16px 0;letter-spacing:1px}
.num-grid .opt small{font-size:12px;color:#8a6a2a;margin-left:3px}

/* === 金光（答對閃現） === */
.glow{position:absolute;border-radius:50%;pointer-events:none;z-index:11;opacity:0;background:radial-gradient(circle,rgba(255,215,130,.7),rgba(255,215,130,0) 70%)}
.glow.go{animation:gflash 1.6s ease}
@keyframes gflash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

/* === 考據 / FACTS 卡 === */
#factsCard{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.94);width:88%;max-width:346px;max-height:78vh;overflow-y:auto;background:linear-gradient(160deg,#efe3c2,#e2d0a4);border:1px solid #b98f3e;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.65),inset 0 0 60px rgba(150,110,50,.18);z-index:26;padding:22px 20px 18px;opacity:0;pointer-events:none;transition:opacity .7s ease,transform .7s ease}
#factsCard.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.fc-tag{display:inline-block;font-size:10px;letter-spacing:3px;color:#fff;background:#8a5a20;border-radius:3px;padding:2px 8px;margin-bottom:12px}
.fc-title{color:#6b4a1a;font-size:17px;letter-spacing:1px;line-height:1.5;margin-bottom:4px}
.fc-sub{color:#8a6a2a;font-size:12px;letter-spacing:1px;margin-bottom:14px}
.fc-zh{color:#4a3410;font-size:13.5px;line-height:1.9;margin-bottom:12px}
.fc-div{border:0;border-top:1px dashed #b98f3e;margin:14px 0}
.fc-btn{display:block;margin:14px auto 0;padding:9px 30px;background:#8a5a20;color:#f5e6c8;border:none;border-radius:999px;font-size:14px;letter-spacing:3px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div id="game">
  <div id="bg"></div>
  <div id="bg2"></div>
  <div id="bg3"></div>
  <div id="bg4"></div>
  <div id="bg5"></div>
  <div id="dim"></div>

  <div id="fx">
    <div id="spotLabel">崗頂劇院</div>
  </div>

  <div id="locLabel">
    <span class="t1">CHAPTER 1 · 崗頂前地</span>
  </div>

  <img id="luvia" src="lucia_squat_v2A.png" alt="Lúcia" onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
  <div id="nameTag"><span>Lúcia</span></div>

  <div id="dlgBox">
    <div id="dlgName">旁　白</div>
    <div id="dlgText"></div>
    <div id="dlgHint">▼</div>
  </div>

  <div class="glow" id="glow1" style="left:50%;top:40%;width:80%;height:30%;transform:translateX(-50%)"></div>
  <div id="puzzleCard"></div>
  <div id="factsCard"></div>

  <div id="introBlack">
    <div id="goldDot"></div>
    <div id="trail"></div>
  </div>
  <div id="flash"></div>
</div>

<audio id="bgm" loop preload="auto"><source src="bgm_praca_dusk.wav"></audio>
<audio id="ambient" loop preload="auto"><source src="ambient_cicada.wav"></audio>
<audio id="voice" preload="auto"></audio>
<audio id="sfx" preload="auto"></audio>

<script>
/* ========== 對話隊列 ========== */
/* {name, text, voice, sfx, action} */
const DLG=[
  {name:'旁　白',text:'你睜開眼，發現自己站在一片波浪形的葡式碎石地上。',voice:'narrator_square_01.wav',sfx:null,action:null},
  {name:'Lúcia',text:'你來啦～',voice:'lucia_02.wav',sfx:'sfx_branch_scratch.wav',action:'luvia_in'},
  {name:'Lúcia',text:'我叫 Lúcia。這地方，我熟。',voice:'lucia_03.wav',sfx:'sfx_hand_clap.wav',action:'luvia_stand'},
  {name:'Lúcia',text:'讓我帶你轉轉吧～先從這個劇院開始。',voice:'lucia_06.wav',sfx:null,action:'luvia_close',duck:true},
  {name:'Lúcia',text:'這個可是中國第一間西洋劇院哦。',voice:'lucia_04.wav',sfx:'sfx_skirt_spin.wav',sfxVol:0.3,action:'luvia_point'},
  {name:'Lúcia',text:'很多人習慣叫它「崗頂劇院」，但其實那不是它正式的名字哦。',voice:'lucia_05.wav',sfx:null,action:null},
  {name:'Lúcia',text:'它的名字就寫在門口的捲軸上，看看你能找到麼？',voice:'lucia_07.wav',sfx:null,action:'luvia_door'}
];

let dlgIdx=0,typeTimer=null,lineDone=false;
const dlgName=document.getElementById('dlgName');
const dlgText=document.getElementById('dlgText');
const dlgBox=document.getElementById('dlgBox');
const dlgHint=document.getElementById('dlgHint');
const luvia=document.getElementById('luvia');
const nameTag=document.getElementById('nameTag');

/* 蹲姿淡出 → 換站姿淡入 + 頭頂名牌浮現 */
function luviaStand(){
  luvia.classList.add('switching');
  luvia.classList.remove('show');
  setTimeout(function(){
    luvia.src='lucia_stand.png';
    luvia.classList.add('stand');
    luvia.classList.remove('switching');
    luvia.classList.add('show');
    nameTag.classList.add('show');
  },220);
}

/* 走近玩家：立繪移中央放大、背景壓暗、名牌隱藏 */
const dim=document.getElementById('dim');
function luviaClose(){
  luvia.classList.add('close');
  nameTag.classList.remove('show');
  dim.classList.add('show');
}

/* 轉圈指劇院：背景切劇院並推近、金光描邊、標籤浮現 */
const bg2=document.getElementById('bg2');
const bg3=document.getElementById('bg3');
const bg4=document.getElementById('bg4');
const bg5=document.getElementById('bg5');
const fx=document.getElementById('fx');
function luviaPoint(){
  luvia.classList.add('spin');
  luvia.addEventListener('animationend',function h(){
    luvia.classList.remove('spin');
    luvia.removeEventListener('animationend',h);
    /* 先回到 .close 姿態，下一幀再移除 close，讓她緩緩滑回左邊 */
    void luvia.offsetWidth;
    requestAnimationFrame(function(){
      luvia.classList.remove('close');
    });
  });
  bg2.classList.add('show');
  dim.classList.remove('show');
  fx.classList.add('show');
}

/* 最後一句：推近門楣捲軸，立繪淡出，讓門楣成為焦點 */
function luviaDoor(){
  bg3.classList.add('show');
  fx.classList.remove('show');
  luvia.classList.add('switching');
  luvia.classList.remove('show');
}

/* BGM 音量漸變（ducking） */
function fadeBgmTo(v,dur){
  const bgm=document.getElementById('bgm');
  const from=bgm.volume,t0=performance.now();
  function tick(t){
    const k=Math.min(1,(t-t0)/dur);
    bgm.volume=from+(v-from)*k;
    if(k<1)requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ========== 音頻初始化 ========== */
let audioStarted=false;
function initAudio(){
  if(audioStarted)return;
  audioStarted=true;
  const bgm=document.getElementById('bgm'); bgm.volume=0.3; bgm.play().catch(function(){});
  const amb=document.getElementById('ambient'); amb.volume=0.15; amb.play().catch(function(){});
}

function playVoice(src){
  const v=document.getElementById('voice');
  v.pause(); v.currentTime=0;
  v.src=src; v.volume=1.0;
  v.play().catch(function(){});
  return v;
}
function playSfx(src,vol){
  if(!src)return;
  const s=document.getElementById('sfx');
  s.pause(); s.currentTime=0;
  s.src=src; s.volume=(vol==null?0.5:vol);
  s.play().catch(function(){});
}

/* ========== 古磬開場音 ========== */
let audioCtx=null;
function ac(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function chime(){
  try{
    const ctx=ac();
    [392,523.25,784].forEach(function(f,i){
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0,ctx.currentTime);
      g.gain.linearRampToValueAtTime(.2/(i+1),ctx.currentTime+.03);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+2.2);
      o.connect(g);g.connect(ctx.destination);
      o.start();o.stop(ctx.currentTime+2.3);
    });
  }catch(e){}
}

/* ========== 顯示一句 ========== */
function showLine(){
  const line=DLG[dlgIdx];
  currentText=line.text;
  dlgName.textContent=line.name;
  dlgName.className = line.name==='Lúcia' ? 'lucia' : '';
  dlgText.textContent='';
  dlgHint.style.display='none';
  lineDone=false;

  if(line.action==='luvia_in'){ luvia.classList.add('show'); }
  if(line.action==='luvia_stand'){ luviaStand(); }
  if(line.action==='luvia_close'){ luviaClose(); }
  if(line.action==='luvia_point'){ luviaPoint(); }
  if(line.action==='luvia_door'){ luviaDoor(); }
  fadeBgmTo(line.duck?0.15:0.3,300);
  playSfx(line.sfx,line.sfxVol);

  const v=playVoice(line.voice);
  v.addEventListener('ended',function(){ if(line.duck)fadeBgmTo(0.3,600); },{once:true});

  let i=0;
  clearInterval(typeTimer);
  typeTimer=setInterval(function(){
    if(i<line.text.length){
      dlgText.textContent+=line.text[i];i++;
    }else{
      clearInterval(typeTimer);typeTimer=null;
      lineDone=true;
      /* 配音播完才出 ▼ */
      if(v.duration && !v.ended){
        v.addEventListener('ended',function(){ dlgHint.style.display='block'; },{once:true});
      }else{
        dlgHint.style.display='block';
      }
    }
  },55);
}

/* ========== 門楣謎題（參考 17 機制） ========== */
const PUZ_HTML=
  '<span class="pz-tag">THE PUZZLE　謎題</span>'+
  '<div class="pz-line">Theatro Dom <span class="blank">＿＿＿＿</span></div>'+
  '<input class="pz-input" id="pzInput" type="text" placeholder="國王的名字" autocomplete="off">'+
  '<button class="pz-btn" id="pzBtn">確 認</button>'+
  '<div class="pz-tip">看看捲軸，那裡記載了答案</div>'+
  '<div class="pz-err" id="pzErr"></div>';

const FACTS_HTML=
  '<span class="fc-tag">考據　REVEAL</span>'+
  '<div class="fc-title" style="text-align:center">PEDRO V　＝　伯多祿五世</div>'+
  '<div class="fc-sub" style="text-align:center">1837–1861</div>'+

let puzzleActive=false;
function openPuzzle(){
  dlgBox.classList.remove('show');
  const card=document.getElementById('puzzleCard');
  card.style.display='';
  card.innerHTML=PUZ_HTML;
  puzzleActive=true;
  setTimeout(function(){
    card.classList.add('show');
    bindPuzzle();
  },450);
}
/* 徹底隱藏謎題卡：淡出後直接 display:none，避免空容器殘留 */
function hidePuzzleCard(){
  const pc=document.getElementById('puzzleCard');
  pc.classList.remove('show');
  setTimeout(function(){
    pc.style.display='none';
    pc.innerHTML='';
  },600);
}
function bindPuzzle(){
  const btn=document.getElementById('pzBtn');
  btn.addEventListener('click',checkInput);
  const inp=document.getElementById('pzInput');
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')checkInput();});
}
function checkInput(){
  const v=document.getElementById('pzInput').value.trim().toLowerCase().replace(/\s+/g,' ');
  const ok=(v==='pedro v'||v==='pedro'||v==='伯多祿五世'||v==='伯多祿5世');
  if(ok)solvePuzzle();
  else document.getElementById('pzErr').textContent='DOM 是尊稱——那麼這座劇院，是獻給哪一位葡國國王？';
}
let confirmLine=false,currentText='';
function solvePuzzle(){
  puzzleActive=false;
  hidePuzzleCard();
  /* Lúcia 回來，說確認台詞 */
  setTimeout(function(){
    luvia.src='lucia_stand.png';
    luvia.classList.add('stand');
    luvia.classList.remove('switching');
    luvia.classList.add('show');
    dlgBox.classList.add('show');
    dlgName.textContent='Lúcia';
    dlgName.className='lucia';
    dlgText.textContent='';
    dlgHint.style.display='none';
    currentText='是的，正是伯多祿五世。';
    const v=playVoice('lucia_08.wav');
    let i=0;
    clearInterval(typeTimer);
    typeTimer=setInterval(function(){
      if(i<currentText.length){dlgText.textContent+=currentText[i];i++;}
      else{
        clearInterval(typeTimer);typeTimer=null;
        if(v.duration&&!v.ended){
          v.addEventListener('ended',function(){dlgHint.style.display='block';},{once:true});
        }else{
          dlgHint.style.display='block';
        }
      }
    },55);
    confirmLine=true;
  },500);
}

function showFacts(){
  dlgBox.classList.remove('show');
  luvia.classList.add('switching');
  luvia.classList.remove('show');
  document.getElementById('glow1').classList.add('go');
  setTimeout(function(){
    const fc=document.getElementById('factsCard');
    fc.innerHTML=FACTS_HTML;
    fc.classList.add('show');
    document.getElementById('fcBtn').addEventListener('click',enterInside);
  },750);
}

/* 收入卷宗後：推門進入劇院內廳 */

/* ========== 第二道謎題：形狀 ========== */
let shapeLine=false;

function startShapeLine(){
  insideLine=false;
  dlgBox.classList.add('show');
  luvia.classList.add('show');
  dlgName.textContent='Lúcia';
  dlgName.className='lucia';
  dlgText.textContent='';
  dlgHint.style.display='none';
  currentText='你看這座位的排列，它們是怎麼環抱你的？';
  const v=playVoice('lucia_10.wav');
  let i=0;
  clearInterval(typeTimer);
  typeTimer=setInterval(function(){
    if(i<currentText.length){dlgText.textContent+=currentText[i];i++;}
    else{
      clearInterval(typeTimer);typeTimer=null;
      if(v.duration&&!v.ended){
        v.addEventListener('ended',function(){dlgHint.style.display='block';},{once:true});
      }else{
        dlgHint.style.display='block';
      }

}
function openShapePuzzle(){
  dlgBox.classList.remove('show');
  const card=document.getElementById('puzzleCard');
  card.style.display='';
  card.innerHTML=PUZ2_HTML;
  puzzleActive=true;
  setTimeout(function(){
    card.classList.add('show');
    bindShapePuzzle();
  },450);
}
function bindShapePuzzle(){
  document.getElementById('hintBtn').addEventListener('click',function(){
    const box=document.getElementById('hintBox');
    box.style.display=box.style.display==='none'?'block':'none';
  });
  document.querySelectorAll('#puzzleCard .opt').forEach(function(o){
    o.addEventListener('click',function(){
      if(o.dataset.ans==='1'){
        solveShapePuzzle();
      }else{
        o.classList.add('wrong');
        setTimeout(function(){o.classList.remove('wrong');},500);
        document.getElementById('pzErr').textContent='再看看現場——答案就在那道弧裡。';
      }
    });
  });
}
function solveShapePuzzle(){
  puzzleActive=false;
  hidePuzzleCard();
  document.getElementById('glow1').classList.add('go');
  setTimeout(function(){
    const fc=document.getElementById('factsCard');
    fc.innerHTML=FACTS2_HTML;
    fc.classList.add('show');
    document.getElementById('fcBtn').addEventListener('click',startStageLine);
  },750);
}

/* ========== 第三道謎題：雙舞台 ========== */
let stageLine=false;
/* 轉身引導句 */

  fc.classList.remove('show');
  setTimeout(function(){

    dlgName.className='lucia';

    currentText='看完了觀眾席，現在轉過身——你數數，這裡有幾個舞台？';

        if(v.duration&&!v.ended){
          v.addEventListener('ended',function(){dlgHint.style.display='block';},{once:true});

function openStagePuzzle(){
  dlgBox.classList.remove('show');

  card.innerHTML=PUZ3_HTML;
  puzzleActive=true;
  setTimeout(function(){
    card.classList.add('show');

}
function bindStagePuzzle(){
  document.getElementById('hintBtn').addEventListener('click',function(){
    const box=document.getElementById('hintBox');
    box.style.display=box.style.display==='none'?'block':'none';

  document.querySelectorAll('#puzzleCard .opt').forEach(function(o){

}
function solveStagePuzzle(){

/* ========== 收尾：三題總結，引導聖奧斯定堂 ========== */
let outroLine=false,storyEnded=false;
function startOutroLine(){
  const fc=document.getElementById('factsCard');
  fc.classList.remove('show');
  setTimeout(function(){
    /* 反向視角淡出，下層劇院外黃昏（bg2）自然露出 */
    bg5.classList.remove('show');
    luvia.src='lucia_stand.png';
    luvia.classList.add('stand');
    luvia.classList.remove('switching');
    luvia.classList.add('show');
    dlgBox.classList.add('show');

    dlgName.className='lucia';
    dlgText.textContent='';

/* ========== 開場動畫 ========== */
setTimeout(function(){
  document.getElementById('trail').classList.add('on');
  chime();
},1600);
setTimeout(function(){
  document.getElementById('flash').classList.add('go');
},2500);
setTimeout(function(){
  document.getElementById('introBlack').classList.add('fade');
  document.getElementById('bg').classList.add('show');
  document.getElementById('locLabel').classList.add('show');
  setTimeout(function(){
    dlgBox.classList.add('show');
    showLine();
  },1400);
},3100);

/* ========== 點擊推進 ==========
   pointerdown 只負責盡早解鎖音頻；對話推進統一用兼容性最可靠的 click，
   避免部分 WebKit/WKWebView 邊緣情況下 pointerdown 丟事件導致點不動。 */
document.addEventListener('pointerdown',initAudio);
document.addEventListener('click',function(e){
  initAudio();
  /* 點擊落在謎題卡／考據卡內時，由卡片自身處理，不觸發對話推進 */
  if(e.target.closest && (e.target.closest('#factsCard')||e.target.closest('#puzzleCard'))){
    return;
  }
  /* 終局鎖：收尾對話框淡出後，任何點擊都不再生效 */
  if(storyEnded)return;
  if(puzzleActive)return;
  if(typeTimer){
    clearInterval(typeTimer);typeTimer=null;
    dlgText.textContent=currentText||DLG[dlgIdx].text;
    if(confirmLine||insideLine||shapeLine||stageLine||outroLine){dlgHint.style.display='block';return;}
    lineDone=true;
    dlgHint.style.display='block';
    return;
  }
  if(confirmLine){
    confirmLine=false;
    showFacts();
    return;
  }
  /* 收尾台詞後：淡出對話框，過渡到聖奧斯定堂新章（21.html） */
  if(outroLine){
    outroLine=false;
    storyEnded=true;   /* 跳轉期間鎖，防止重複點擊 */
    dlgHint.style.display='none';
    dlgBox.classList.remove('show');
    setTimeout(function(){ window.location.href='21.html'; },850);
    return;
  }
  /* 轉身引導句後：打開數字謎題卡 */
  if(stageLine){
    stageLine=false;
    openStagePuzzle();
    return;
  }
  /* 形狀引導句後：打開形狀謎題卡 */
  if(shapeLine){
    shapeLine=false;
    openShapePuzzle();
    return;
  }
  /* 內廳台詞後：進入形狀引導句 */
  if(insideLine){
    startShapeLine();
    return;
  }
  if(!lineDone)return;
  dlgIdx++;
  if(dlgIdx>=DLG.length){
    dlgHint.style.display='none';
    openPuzzle();
    return;
  }
  showLine();
});
</script>
